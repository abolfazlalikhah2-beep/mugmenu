services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://magmenu:magmenu_dev_password@db:5432/magmenu?schema=public
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: magmenu
      S3_SECRET_KEY: magmenu_dev_password
      S3_BUCKET: magmenu-uploads
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: magmenu
      POSTGRES_PASSWORD: magmenu_dev_password
      POSTGRES_DB: magmenu
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magmenu -d magmenu"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for local dev/testing of image uploads
  # (CLAUDE.md's "S3-compatible storage" — not wired into app code yet).
  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: magmenu
      MINIO_ROOT_PASSWORD: magmenu_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data

volumes:
  db-data:
  storage-data:
