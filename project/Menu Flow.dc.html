  ::-webkit-scrollbar { width:6px; height:6px; }

</style>
</helmet>
<div dir="rtl" style="font-family:'Vazirmatn',sans-serif; background:#EDEEED; color:#000; min-height:100vh; padding:56px 48px 120px; direction:rtl;">
  <div style="max-width:1400px; margin:0 auto; display:flex; flex-direction:column; gap:52px;">

    <div style="display:flex; flex-direction:column; gap:6px;">
      <span style="font-family:'Montserrat'; font-size:11px; letter-spacing:.42em; text-transform:uppercase; color:#B7B7B7;">STEP 1 · CUSTOMER MENU · RTL · RESPONSIVE</span>
      <h1 style="margin:0; font-size:30px; font-weight:700;">قدم ۱ — منوی عمومی مشتری</h1>
      <p style="margin:0; font-size:14px; font-weight:300; color:#5F5F5F;">هر صفحه در دو حالت موبایل (۳۹۰px) و دسکتاپ (۱۹۲۰px). راست‌چین کامل، بک‌گراند خاکستری روشن مطابق Menu.png.</p>
    </div>

    <sc-for list="{{ frames }}" as="f" hint-placeholder-count="8">
      <div style="display:flex; flex-direction:column; gap:16px;">
        <div style="display:flex; align-items:center; gap:12px;">
          <span style="font-family:'Montserrat'; font-size:12px; font-weight:600; color:#328C3D; background:#E5F0E6; border-radius:8px; padding:4px 10px;">{{ f.tag }}</span>

          <span style="font-size:13px; font-weight:300; color:#9F9F9F;">{{ f.note }}</span>
        </div>
        <div style="display:flex; gap:34px; align-items:flex-start; flex-wrap:wrap;">
          <div style="display:flex; flex-direction:column; gap:10px; align-items:center;">
            <span style="font-family:'Montserrat'; font-size:10px; letter-spacing:.3em; color:#B7B7B7;">MOBILE · 390</span>
            {{ f.mobile }}
          </div>
          <div style="display:flex; flex-direction:column; gap:10px; align-items:center;">
            <span style="font-family:'Montserrat'; font-size:10px; letter-spacing:.3em; color:#B7B7B7;">DESKTOP · 1920</span>
            {{ f.desktop }}
          </div>
        </div>
      </div>
    </sc-for>

  </div>
</div>

      else if(mode===1) modeFields=[field('زمان تحویل تخمینی','','امروز · ۲۵ دقیقه دیگر آماده می‌شود'),R('div',{key:1,style:{display:'flex',gap:12,flexWrap:m?'wrap':'nowrap'}},field('نام شما','نام و نام خانوادگی',''),field('شماره تماس','0912 000 0000',''))];

        R('div',{key:'map',style:{height:110,borderRadius:14,border:'1px solid #E7E7E7',position:'relative',overflow:'hidden'}},R('image-slot',{id:p+'-map',shape:'rect',src:'',placeholder:'انتخاب لوکیشن روی نقشه',style:{position:'absolute',inset:0}}),R('div',{style:{position:'absolute',left:'50%',top:'50%',transform:'translate(-50%,-100%)'}},Pin(28,'#328C3D'))),
        R('div',{key:2,style:{display:'flex',gap:12,flexWrap:m?'wrap':'nowrap'}},field('زمان تحویل','','۴۵ تا ۶۰ دقیقه'),field('شماره تماس','0912 000 0000',''))];
      return R('div',{style:{width:'100%'}},
        topBar('سبد خرید',m),
        R('div',{style:{padding:m?'16px':'20px 34px',display:'flex',flexDirection:'column',gap:16}},
          seg,
          R('div',null, cartLines(p)),
          R('div',{style:{background:'#FAFBFA',border:'1px solid #F0F0F0',borderRadius:18,padding:'16px 18px',display:'flex',flexDirection:'column',gap:12}},
            R('div',{style:{display:'flex',alignItems:'center',gap:8,justifyContent:'flex-start'}},
              R('span',{style:{fontSize:14,fontWeight:500,color:'#555'}},'جزئیات تحویل'),
              R('span',{style:{fontSize:11,color:'#328C3D',background:'#E5F0E6',borderRadius:8,padding:'3px 10px'}},tabs[mode])),
            ...modeFields),
          R('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',paddingTop:2}},
            R('span',{style:{fontSize:14,fontWeight:300,color:'#777'}},'مبلغ قابل پرداخت'),
            R('span',{style:{fontSize:18,fontWeight:600,color:'#328C3D'}},[money(items[0].price*2+items[3].price),' تومان'])),

    };

    // 7) RECEIPT
    const sReceipt=(p,m)=>{
      const rline=(l,v,b)=>R('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between'}},
        R('span',{style:{fontSize:b?16:14,fontWeight:b?600:400,color:b?'#328C3D':'#555'}},l),
        R('span',{style:{fontSize:b?16:14,fontWeight:b?600:300,color:b?'#000':'#777'}},v));

          R('div',{style:{height:1,background:'#F0F0F0'}}),
          rline('مبلغ پرداخت‌شده',money(items[0].price*2+items[3].price+12000)+' تومان',true)),

          R('button',{style:{fontFamily:'inherit',flex:1,minWidth:m?'100%':0,height:52,border:'none',borderRadius:15,background:'#328C3D',color:'#fff',fontSize:16,cursor:'pointer'}},'پیگیری سفارش'),
          R('button',{style:{fontFamily:'inherit',flex:1,minWidth:m?'100%':0,height:52,border:'1px solid #DDD',borderRadius:15,background:'#fff',color:'#328C3D',fontSize:16,cursor:'pointer'}},'بازگشت به منو')));
    };

    // 8) ITEM REVIEWS
    const sReviews=(p,m)=>{
      const row=(rv,i)=>R('div',{key:i,style:{padding:'18px 0',borderBottom:'1px solid #EEE',display:'flex',gap:14,alignItems:'flex-start'}},
        R('div',{style:{textAlign:'right',flexShrink:0,width:m?116:150}},

        R('div',{style:{flex:1,textAlign:'right'}},
          R('p',{style:{margin:0,fontSize:13,lineHeight:1.9,color:'#555',textAlign:'justify'}},rv.text),
          R('span',{style:{display:'inline-block',marginTop:10,fontSize:9,color:'#555',background:'#F6F6F6',border:'0.3px solid #CECECE',borderRadius:10,padding:'4px 12px'}},rv.dish)));
      return R('div',{style:{width:'100%'}},
        topBar('نظرات — چلوکباب وزیری',m),
        R('div',{style:{padding:m?'16px 16px 0':'22px 26px 0',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12}},
          R('div',{style:{display:'flex',alignItems:'center',gap:12}},
            R('div',{style:{fontSize:34,fontWeight:700}},'۴٫۴'),
            R('div',{style:{textAlign:'right'}},R('div',{style:{display:'flex',gap:2}},[0,1,2,3,4].map(k=>Star(16,k<4?'#FACB0F':'#E3E3E3'))),R('div',{style:{fontSize:12,color:'#9F9F9F',marginTop:4}},'بر پایه ۳۸ نظر'))),
          R('div',{style:{display:'flex',gap:10}},
            R('span',{style:{height:34,padding:'0 18px',display:'flex',alignItems:'center',borderRadius:10,fontSize:13,background:'#F6F6F6',border:'0.3px solid #CECECE'}},'مرتبط ترین'),
            R('span',{style:{height:34,padding:'0 18px',display:'flex',alignItems:'center',borderRadius:10,fontSize:12,background:'#F6F6F6',color:'#777',opacity:.65}},'جدیدترین'))),
        R('div',{style:{padding:m?'6px 16px 20px':'8px 26px 24px'}},this.reviewData().map(row)));
    };

    // 9) INFO MODAL
    const sInfo=(p,m)=>{
      const irow=(icon,label,val)=>R('div',{style:{height:44,border:'1px solid #E3E3E3',borderRadius:20,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 18px'}},
        R('div',{style:{display:'flex',alignItems:'center',gap:8}},icon,R('span',{style:{fontSize:14}},label)),
        R('span',{style:{fontSize:12,fontWeight:300,color:'#000'}},val));
      const card=R('div',{style:{width:'100%',padding:m?'44px 18px 22px':'30px 30px 26px',position:'relative'}},
        R('div',{style:{position:'absolute',left:m?18:26,top:m?44:26,cursor:'pointer'}},R('svg',{width:28,height:28,viewBox:'0 0 24 24',fill:'none'},R('path',{d:'M6 6l12 12M18 6L6 18',stroke:'#969696',strokeWidth:1.6,strokeLinecap:'round'}))),
        R('div',{style:{display:'flex',gap:14,alignItems:'flex-start',justifyContent:'space-between',marginBottom:18,flexWrap:'wrap'}},
          R('div',{style:{display:'flex',gap:14}},logoBox(m?54:64),
            R('div',{style:{textAlign:'right',display:'flex',flexDirection:'column',gap:6}},

              R('div',{style:{display:'flex',alignItems:'center',gap:6}},Pin(13),R('span',{style:{fontSize:12,fontWeight:300,color:'#9F9F9F'}},'تبریز، ولیعصر، پروین اعتصامی')),
              R('div',{style:{display:'flex',alignItems:'center',gap:6}},statusDot(),R('span',{style:{fontSize:12,color:'#10D37B'}},'سفارش میپذیریم')))),

        R('div',{style:{display:'flex',flexDirection:'column',gap:12}},
          irow(clockI(),'ساعت کاری','امروز از ساعت 15:00 تا 00:00'),
          irow(phoneI(),'شماره تماس','0912 123 457'),
          R('div',{style:{textAlign:'right',marginTop:4}},R('div',{style:{fontSize:14,fontWeight:400,marginBottom:8}},'درباره رستوران'),
            R('p',{style:{margin:0,fontSize:12,fontWeight:300,lineHeight:1.9,color:'#555',textAlign:'justify'}},'رستوران ما با الهام از طعم‌های اصیل و مواد اولیه تازه، تلاش می‌کند لحظاتی خوشمزه و به‌یادماندنی برای شما بسازد. غذا فقط یک وعده نیست، بلکه تجربه‌ای دلنشین است که با عشق، کیفیت و احترام همراه است.')),
          R('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:4,flexWrap:'wrap',gap:10}},
            R('span',{style:{fontSize:14,fontWeight:400}},'نظرات کاربران'),
            R('div',{style:{display:'flex',gap:8}},R('span',{style:{height:32,padding:'0 16px',display:'flex',alignItems:'center',borderRadius:10,fontSize:12,background:'#F6F6F6',border:'0.3px solid #CECECE'}},'مرتبط ترین'),R('span',{style:{height:32,padding:'0 16px',display:'flex',alignItems:'center',borderRadius:10,fontSize:12,background:'#F6F6F6',color:'#777',opacity:.65}},'جدیدترین'))),
          R('div',{style:{display:'flex',gap:14,alignItems:'flex-start',paddingTop:6}},
            R('div',{style:{textAlign:'right',flexShrink:0}},R('div',{style:{fontSize:14,fontWeight:700}},'ابلفضل علیخواه'),R('div',{style:{fontSize:11,fontWeight:300,color:'#919191',marginTop:3}},'شنبه | ۴ مرداد ۱۴۰۴')),
            R('p',{style:{flex:1,margin:0,fontSize:12,lineHeight:1.7,color:'#555',textAlign:'justify'}},'پیک غذا رو سریع رسوند خیلی تشکر. اما غذا خیلی شور بود، نشد که همه غذا رو بخوریم و لذت ببریم.'))));
      // desktop: overlay on dimmed desk; mobile: full sheet
      if(m) return card;
      return R('div',{style:{width:'100%',position:'relative',background:'#E9EAE9',padding:'40px 60px',display:'flex',justifyContent:'center'}},
        R('div',{style:{position:'absolute',inset:0,background:'rgba(0,0,0,0.16)'}}),
        R('div',{style:{position:'relative',width:640,background:'#fff',borderRadius:35,boxShadow:'0px 26px 41.2px 4px rgba(0,0,0,0.1)',overflow:'hidden'}},card));
    };

    const F=(tag,title,note,build)=>({tag,title,note,mobile:phoneFrame(build('m',true)),desktop:deskFrame(build('d',false))});
    return { frames: [
      F('موجود','منو — انتخاب نوع سفارش','بازسازی flow از Menu.png · بک‌گراند دسکتاپ خاکستری روشن', sMenu),
      F('جدید','لیست آیتم‌های یک دسته','دسته‌بندی‌ها راست‌چین + آیکون‌دار · گرید کارت', sList),
      F('جدید','جزئیات یک آیتم','عنوان راست، ریتینگ چپ، تعداد راست، استپر چپ', sDetail),
      F('جدید','سبد خرید — روی میز','شماره میز + نام + تلفن', (p,m)=>sCart(p,m,0)),
      F('جدید','سبد خرید — بیرون‌بر','زمان تحویل تخمینی', (p,m)=>sCart(p,m,1)),
      F('جدید','سبد خرید — ارسال با پیک','آدرس + لوکیشن + زمان · دکمه داخل فریم', (p,m)=>sCart(p,m,2)),
      F('جدید','تایید سفارش / رسید','وضعیت موفق + خلاصه پرداخت', sReceipt),
      F('جدید','نظرات آیتم','سطح آیتم، جدا از نظرات کلی', sReviews),
      F('موجود','اطلاعات مجموعه (مودال)','بازسازی از info.png', sInfo),
    ]};
  }

  itemsData(){return[
    {name:'چلوکباب وزیری',price:385000,desc:'یک سیخ کوبیده و یک سیخ برگ زعفرانی با برنج ایرانی',long:'ترکیبی از یک سیخ کباب کوبیده دست‌ساز و یک سیخ کباب برگ گوسفندی زعفرانی، سرو‌شده با برنج ایرانی دم‌کشیده، کره محلی و گوجه کبابی.'},
    {name:'چلوکباب سلطانی',price:420000,desc:'برگ ممتاز و کوبیده مخصوص، سرو با برنج زعفرانی'},
    {name:'جوجه‌کباب زعفرانی',price:295000,desc:'ران مرغ زعفرانی و ترد، همراه با برنج و ته‌دیگ'},
    {name:'کباب کوبیده (۲ سیخ)',price:220000,desc:'گوشت مخلوط تازه، دو سیخ کوبیده با برنج ایرانی'},
    {name:'کباب برگ',price:450000,desc:'فیله گوسفندی مزه‌دار، نرم و زعفرانی'},
    {name:'چلو ماهیچه',price:520000,desc:'ماهیچه گوسفندی آرام‌پز با برنج زعفرانی'},
  ];}

    {name:'مریم رستمی',date:'جمعه | ۳ مرداد ۱۴۰۴ | ۱۹:۱۰',rate:'5.0',dish:'چلوکباب وزیری',text:'کیفیت گوشت واقعاً عالی بود، کوبیده‌ش دست‌ساز و خوش‌طعم. حتماً دوباره سفارش می‌دم.'},
    {name:'سعید کاظمی',date:'پنجشنبه | ۲ مرداد ۱۴۰۴ | ۱۴:۲۲',rate:'4.0',dish:'چلوکباب وزیری',text:'برنجش عالی بود ولی کباب برگ یه‌کم خشک شده بود. در کل راضی بودم و بسته‌بندی تمیز بود.'},
  ];}
}
